<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>#{{ room }} — SentimentChat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="bg-gray-950 text-white h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="bg-gray-900 border-b border-gray-800 px-5 py-3 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <a href="/" class="text-gray-500 hover:text-white transition text-lg leading-none">←</a>
      <div>
        <h1 class="font-semibold text-sm"># {{ room }}</h1>
        <p id="userCount" class="text-xs text-gray-500">connecting…</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <div id="moodBadge"
        class="text-xs font-medium px-3 py-1.5 rounded-full bg-gray-800 text-gray-400 transition-all">
        Room Mood: —
      </div>
      <a href="/dashboard/{{ room }}" target="_blank"
        class="text-xs bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-full transition flex items-center gap-1.5">
        📊 <span class="hidden sm:inline">Dashboard</span>
      </a>
      <a href="/logout"
        class="text-xs text-gray-500 hover:text-white px-3 py-1.5 rounded-full hover:bg-gray-800 transition">
        Sign out
      </a>
    </div>
  </header>

  <!-- Messages -->
  <main id="messages" class="flex-1 overflow-y-auto px-4 py-5 space-y-3">
    <div id="loadingMsg" class="text-center text-gray-600 text-sm py-12">Loading messages…</div>
  </main>

  <!-- Input -->
  <footer class="bg-gray-900 border-t border-gray-800 px-4 py-4 shrink-0">
    <form id="msgForm" class="flex gap-3">
      <input id="msgInput" type="text" placeholder="Type a message…" autocomplete="off"
        class="flex-1 bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white
               placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500
               focus:border-transparent transition" />
      <button type="submit"
        class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white px-5 py-3 rounded-xl
               text-sm font-semibold transition-colors shrink-0">
        Send
      </button>
    </form>
  </footer>

  <script>
    const ROOM = "{{ room }}";
    const ME   = "{{ username }}";

    const messagesEl  = document.getElementById('messages');
    const userCountEl = document.getElementById('userCount');
    const moodBadgeEl = document.getElementById('moodBadge');
    const msgForm     = document.getElementById('msgForm');
    const msgInput    = document.getElementById('msgInput');

    const SENTIMENT = {
      positive: { wrap: 'bg-green-900/20 border-green-800/40', badge: 'bg-green-900/60 text-green-300' },
      negative: { wrap: 'bg-red-900/20 border-red-800/40',   badge: 'bg-red-900/60 text-red-300' },
      neutral:  { wrap: 'bg-gray-800/60 border-gray-700/50', badge: 'bg-gray-700 text-gray-400' },
    };

    let recentScores = [];

    function esc(t) {
      return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function timeStr(iso) {
      return new Date(iso || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function appendMessage(d) {
      document.getElementById('loadingMsg')?.remove();
      const cfg  = SENTIMENT[d.sentiment.label] || SENTIMENT.neutral;
      const isMe = d.username === ME;
      const row  = document.createElement('div');
      row.className = `flex ${isMe ? 'justify-end' : 'justify-start'} msg-row`;
      row.innerHTML = `
        <div class="max-w-sm md:max-w-lg">
          ${!isMe ? `<p class="text-xs text-gray-500 mb-1 ml-1">${esc(d.username)}</p>` : ''}
          <div class="border ${cfg.wrap} rounded-2xl px-4 py-3">
            <p class="text-sm text-white leading-relaxed">${esc(d.content)}</p>
            <div class="flex items-center gap-2 mt-2 flex-wrap">
              <span class="text-xs px-2 py-0.5 rounded-full font-medium ${cfg.badge}">
                ${d.sentiment.emoji} ${d.sentiment.label} ${d.sentiment.score > 0 ? '+' : ''}${d.sentiment.score}
              </span>
              <span class="text-xs text-gray-600">${timeStr(d.created_at)}</span>
            </div>
          </div>
        </div>`;
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      recentScores.push(d.sentiment.score);
      if (recentScores.length > 15) recentScores.shift();
      updateMood();
    }

    function appendSystem(text, users) {
      document.getElementById('loadingMsg')?.remove();
      if (users !== undefined) userCountEl.textContent = `${users} online`;
      const el = document.createElement('div');
      el.className = 'text-center text-xs text-gray-600 py-0.5';
      el.textContent = text;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function updateMood() {
      if (!recentScores.length) return;
      const avg = recentScores.reduce((a, b) => a + b, 0) / recentScores.length;
      let label, cls;
      if (avg >= 0.05)       { label = '😊 Positive'; cls = 'bg-green-900/40 text-green-300'; }
      else if (avg <= -0.05) { label = '😟 Negative'; cls = 'bg-red-900/40 text-red-300'; }
      else                   { label = '😐 Neutral';  cls = 'bg-gray-800 text-gray-400'; }
      moodBadgeEl.textContent = `Room Mood: ${label}`;
      moodBadgeEl.className = `text-xs font-medium px-3 py-1.5 rounded-full transition-all ${cls}`;
    }

    const EMOJI = { positive: '😊', negative: '😟', neutral: '😐' };

    fetch(`/api/messages/${ROOM}`)
      .then(r => r.json())
      .then(msgs => {
        if (!msgs.length) {
          document.getElementById('loadingMsg').textContent = 'No messages yet — say hello!';
          return;
        }
        msgs.forEach(m => appendMessage({
          username: m.username, content: m.content,
          sentiment: { label: m.sentiment_label, score: m.sentiment_score, emoji: EMOJI[m.sentiment_label] || '😐' },
          created_at: m.created_at,
        }));
      });

    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${proto}//${location.host}/ws/${ROOM}/${encodeURIComponent(ME)}`);

    ws.onmessage = e => {
      const d = JSON.parse(e.data);
      if (d.type === 'message') appendMessage(d);
      else if (d.type === 'system') appendSystem(d.message, d.users);
    };
    ws.onopen  = () => userCountEl.textContent = '1 online';
    ws.onclose = () => appendSystem('Disconnected. Refresh to reconnect.');

    msgForm.addEventListener('submit', e => {
      e.preventDefault();
      const text = msgInput.value.trim();
      if (text && ws.readyState === WebSocket.OPEN) {
        ws.send(text);
        msgInput.value = '';
      }
    });

    msgInput.focus();
  </script>
</body>
</html>
